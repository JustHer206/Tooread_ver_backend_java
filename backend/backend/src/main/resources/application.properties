spring.application.name=backend

# 1. Cấu hình đường dẫn kết nối tới MySQL XAMPP (Database: tooread_db)
spring.datasource.url=jdbc:mysql://localhost:3306/tooread_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Cấu hình Hibernate / JPA (Quản lý cách Java giao tiếp với CSDL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Giữ chế độ 'update' để tự cập nhật cấu trúc bảng, không làm mất dữ liệu cũ
spring.jpa.hibernate.ddl-auto=update
# Hiện câu lệnh SQL ra màn hình Console để bạn dễ theo dõi/debug khi chạy code
spring.jpa.show-sql=true