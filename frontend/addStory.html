<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Truyện Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-label { font-weight: 500; }
        .required::after { content: " *"; color: red; }
    </style>
</head>
<body class="bg-light p-4">

       <header class="navbar navbar-expand bg-white border-bottom align-items-center w-100 px-5" style="height: 70px;">
        <div class="container-fluid d-flex align-items-center justify-content-between p-0">

            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="d-flex align-items-center gap-3">
                    <img src="logo3.webp" alt="Logo TooRead" width="110">
                </a>

                <div class="border-start bg-body-secondary" style="height: 28px; width: 1px;"></div>

                <span class="fs-4 fw-extrabold text-dark text-uppercase tracking-tight"
                    style="font-family: system-ui, -apple-system, sans-serif;">
                    Dashboard
                </span>
            </div>

            <div class="d-flex align-items-center">
                <span class="bg-body-secondary text-dark rounded-pill px-4 py-2 fw-bold small border text-nowrap">
                    vịt việt
                </span>
            </div>

        </div>
    </header>

<div class="container bg-white p-4 shadow-sm rounded" style="max-width: 800px;">
    <form>
        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label required">Tiêu đề</label>
            <div class="col-sm-9">
                <input type="text" class="form-control">
            </div>
        </div>

        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Tên khác</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" placeholder="Ngăn cách nhiều tên bằng dấu chấm phẩy ;">
            </div>
        </div>

        <div class="mb-3 row">
            <div class="col-sm-3">Nội dung nhạy cảm</div>
            <div class="col-sm-9">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="sensitive">
                    <label class="form-check-label text-muted" for="sensitive">(Đánh dấu nếu truyện có nội dung không dành cho trẻ nhỏ)</label>
                </div>
            </div>
        </div>

        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label required">Tác giả</label>
            <div class="col-sm-9"><input type="text" class="form-control"></div>
        </div>
        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Họa sĩ</label>
            <div class="col-sm-9"><input type="text" class="form-control"></div>
        </div>

        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label required">Loại truyện</label>
            <div class="col-sm-9">
                <select class="form-select"><option>Truyện dịch</option></select>
            </div>
        </div>
        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label required">Nhóm dịch</label>
            <div class="col-sm-9">
                <select class="form-select"><option>Hako Translation</option></select>
            </div>
        </div>

        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label required">Thể loại</label>
            <div class="col-sm-9"><textarea class="form-control" rows="2"></textarea></div>
        </div>

        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label required">Tóm tắt</label>
            <div class="col-sm-9">
                <textarea class="form-control" rows="4" placeholder="Nhập nội dung vào đây..."></textarea>
            </div>
        </div>

        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Chú thích thêm</label>
            <div class="col-sm-9">
                <textarea class="form-control" rows="4" placeholder="Nhập nội dung vào đây..."></textarea>
            </div>
        </div>

        <div class="mb-3 row">
            <label class="col-sm-3 col-form-label required">Tình trạng dịch</label>
            <div class="col-sm-9">
                <select class="form-select"><option>Đang tiến hành</option></select>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-9 offset-sm-3">
                <button type="submit" class="btn btn-primary px-4">Thêm truyện</button>
            </div>
        </div>
    </form>
</div>

</body>
</html>
